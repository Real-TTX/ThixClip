# ThixClip.Cloud - Release (branch main, image :latest)
#   docker compose up -d        ->  http://localhost:4950
# The first visit opens the setup assistant: it creates the administrator. Then sign in the ThixClip app with that account
# (ThixClip > Einstellungen > Cloud, server address of this installation). Put a TLS proxy in front of it for use over the internet.
name: thixclip

services:
  web:
    image: ghcr.io/real-ttx/thixclip:latest
    restart: unless-stopped
    ports:
      - "4950:4950"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: thixclip
      POSTGRES_USER: thixclip
      POSTGRES_PASSWORD: thixclip
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thixclip -d thixclip"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  web-data:
  db-data:
