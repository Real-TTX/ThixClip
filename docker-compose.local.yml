# ThixClip.Cloud - Local (builds the image from this folder) with pgAdmin
#   ./scripts/redeploy.ps1              (rebuilds and starts the stack: the way to test every change)
#   docker compose -f docker-compose.local.yml up -d --build
#   App:      http://localhost:4950
#   pgAdmin:  http://localhost:4951   (no sign-in; database password: thixclip)
#   Postgres: localhost:4952          (for "dotnet run" outside Docker, see appsettings.Development.json)
name: thixclip-local

services:
  web:
    build: .
    image: thixclip:local
    restart: unless-stopped
    ports:
      - "4950:4950"
    volumes:
      - web-data:/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - "4952:5432"
    environment:
      POSTGRES_DB: thixclip
      POSTGRES_USER: thixclip
      POSTGRES_PASSWORD: thixclip
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thixclip -d thixclip"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    ports:
      - "4951:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thixclip.example.com
      PGADMIN_DEFAULT_PASSWORD: thixclip
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    configs:
      - source: servers
        target: /pgadmin4/servers.json
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db

configs:
  servers:
    content: |
      {"Servers": {"1": {"Name": "ThixClip (local)", "Group": "Servers", "Host": "db", "Port": 5432, "MaintenanceDB": "thixclip", "Username": "thixclip", "SSLMode": "prefer"}}}

volumes:
  web-data:
  db-data:
  pgadmin-data:

# A fixed subnet: on a machine with many stacks Docker runs out of address pools otherwise
# ("all predefined address pools have been fully subnetted").
networks:
  default:
    ipam:
      config:
        - subnet: 10.253.50.0/24
